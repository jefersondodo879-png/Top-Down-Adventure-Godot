name: Diagnose RPG Essentials Audio Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-audio-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official archive and list contents
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import http.cookiejar, io, json, re, urllib.parse, urllib.request, zipfile

          base='https://leohpaz.itch.io'
          slug='/rpg-essentials-sfx-free'
          ua='Mozilla/5.0'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def req(url, data=None, headers=None):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              r=urllib.request.Request(url, data=data, headers=h)
              return opener.open(r, timeout=120)

          purchase_url=base+slug+'/purchase'
          html=req(purchase_url).read().decode('utf-8','replace')
          csrf=re.search(r'<meta name="csrf_token" value="([^"]+)"', html).group(1)
          raw=req(base+slug+'/download_url', data=urllib.parse.urlencode({'csrf_token':csrf}).encode(), headers={'Referer':purchase_url,'X-Requested-With':'XMLHttpRequest'}).read().decode('utf-8','replace')
          page_url=json.loads(raw)['url']
          page=req(page_url, headers={'Referer':purchase_url}).read().decode('utf-8','replace')
          upload_id=re.search(r'data-upload_id="(\d+)"', page).group(1)
          page_csrf=re.search(r'<meta name="csrf_token" value="([^"]+)"', page).group(1)

          file_endpoint=f'{base}{slug}/file/{upload_id}?source=game_download'
          file_raw=req(file_endpoint, data=urllib.parse.urlencode({'csrf_token':page_csrf}).encode(), headers={'Referer':page_url,'X-Requested-With':'XMLHttpRequest'}).read().decode('utf-8','replace')
          print('file endpoint response:', file_raw[:2000])
          file_url=json.loads(file_raw).get('url','')
          assert file_url, 'file url missing'
          data=req(file_url, headers={'Referer':page_url}).read()
          print('downloaded bytes:', len(data), 'signature:', data[:4])
          assert data[:2] == b'PK', 'downloaded payload is not a ZIP'

          z=zipfile.ZipFile(io.BytesIO(data))
          print('archive entries:', len(z.namelist()))
          for n in z.namelist():
              print(n)
          bad=z.testzip()
          assert bad is None, f'bad zip entry: {bad}'
          PY
