name: Build Godot Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'
      - 'tools/integrate_project.py'

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input ZIPs
        shell: bash
        run: |
          set -e
          required=(
            "input/Top_Down_Adventure_V1_8_3.zip"
            "input/496_RPG_icons.zip"
            "input/mino_v1.1_free(1).zip"
            "input/Animated insect enemy assets(1).zip"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done

      - name: Integrate content
        run: python3 tools/integrate_project.py

      - name: Upload updated Godot project
        uses: actions/upload-artifact@v4
        with:
          name: Top_Down_Adventure_V1_8_4_ICONS_MINOTAUR_MANTIS
          path: dist/Top_Down_Adventure_V1_8_4_ICONS_MINOTAUR_MANTIS.zip
          if-no-files-found: error
          retention-days: 30
