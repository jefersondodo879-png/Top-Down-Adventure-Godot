name: Diagnose RPG Essentials Audio Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-audio-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect upload download endpoint
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import http.cookiejar, json, re, urllib.parse, urllib.request

          base='https://leohpaz.itch.io'
          slug='/rpg-essentials-sfx-free'
          ua='Mozilla/5.0'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def req(url, data=None, headers=None):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              r=urllib.request.Request(url, data=data, headers=h)
              return opener.open(r, timeout=60)

          html=req(base+slug+'/purchase').read().decode('utf-8','replace')
          csrf=re.search(r'<meta name="csrf_token" value="([^"]+)"', html).group(1)
          raw=req(base+slug+'/download_url', data=urllib.parse.urlencode({'csrf_token':csrf}).encode(), headers={'Referer':base+slug+'/purchase','X-Requested-With':'XMLHttpRequest'}).read().decode('utf-8','replace')
          page_url=json.loads(raw)['url']
          page=req(page_url, headers={'Referer':base+slug+'/purchase'}).read().decode('utf-8','replace')
          upload_id=re.search(r'data-upload_id="(\d+)"', page).group(1)
          page_csrf=re.search(r'<meta name="csrf_token" value="([^"]+)"', page).group(1)
          print('upload_id:', upload_id)
          print('page_url:', page_url)

          print('\n=== PAGE TOKEN CONTEXT ===')
          for token in ['download_btn','upload_id','game_download','download_url']:
              idx=page.find(token)
              print('TOKEN', token, 'idx=', idx)
              if idx >= 0:
                  print(page[max(0,idx-1000):idx+2500])

          scripts=re.findall(r'<script[^>]+src="([^"]+)"', page)
          for url in scripts:
              try:
                  js=req(url).read().decode('utf-8','replace')
              except Exception as e:
                  print('script fetch failed', url, e)
                  continue
              hits=[]
              for token in ['download_btn','upload_id','uploadId','game_download','download_url','/file/']:
                  idx=js.find(token)
                  if idx >= 0:
                      hits.append((token,idx))
              if hits:
                  print('\n=== SCRIPT', url, '===', hits)
                  for token,idx in hits:
                      print('\nTOKEN',token)
                      print(js[max(0,idx-1200):idx+2600])
          PY
