name: Diagnose RPG Essentials Audio Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-audio-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect itch direct-download flow
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re, urllib.request

          headers={'User-Agent':'Mozilla/5.0'}
          purchase='https://leohpaz.itch.io/rpg-essentials-sfx-free/purchase'
          html=urllib.request.urlopen(urllib.request.Request(purchase, headers=headers), timeout=30).read().decode('utf-8','replace')
          csrf=re.search(r'<meta name="csrf_token" value="([^"]+)"', html)
          print('csrf found:', bool(csrf))
          js_urls=re.findall(r'<script[^>]+src="([^"]+)"', html)
          print('scripts:', js_urls)
          checkout=[u for u in js_urls if 'checkout' in u]
          if checkout:
              url=checkout[0]
              js=urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30).read().decode('utf-8','replace')
              print('checkout bytes:', len(js))
              for token in ['direct_download_btn','download_key','free_download','claim','purchase/download','download_url']:
                  idx=js.find(token)
                  print('\nTOKEN', token, 'idx=', idx)
                  if idx >= 0:
                      print(js[max(0,idx-1400):idx+2400])
          PY
