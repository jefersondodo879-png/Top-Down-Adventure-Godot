name: Diagnose RPG Essentials Audio Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-audio-source.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe official itch download flow
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import http.cookiejar, json, re, urllib.parse, urllib.request

          base='https://leohpaz.itch.io'
          slug='/rpg-essentials-sfx-free'
          ua='Mozilla/5.0'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def req(url, data=None, headers=None):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              r=urllib.request.Request(url, data=data, headers=h)
              return opener.open(r, timeout=60)

          html=req(base+slug+'/purchase').read().decode('utf-8','replace')
          m=re.search(r'<meta name="csrf_token" value="([^"]+)"', html)
          assert m, 'csrf not found'
          csrf=m.group(1)
          payload=urllib.parse.urlencode({'csrf_token':csrf}).encode()
          raw=req(base+slug+'/download_url', data=payload, headers={'Referer':base+slug+'/purchase','X-Requested-With':'XMLHttpRequest'}).read().decode('utf-8','replace')
          print('download_url response:', raw[:2000])
          obj=json.loads(raw)
          download_page=obj.get('url','')
          assert download_page, 'download page URL missing'
          print('download page:', download_page)

          page=req(download_page, headers={'Referer':base+slug+'/purchase'}).read().decode('utf-8','replace')
          print('download page bytes:', len(page))
          print('\n=== DOWNLOAD PAGE RELEVANT LINES ===')
          for line in page.splitlines():
              low=line.lower()
              if 'rpg_essentials_free.zip' in low or 'upload' in low or 'download' in low or 'file' in low:
                  print(line[:5000])
          PY
